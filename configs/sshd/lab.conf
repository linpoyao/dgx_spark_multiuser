# /etc/ssh/sshd_config.d/lab.conf —— DGX Spark 實驗室硬化設定
# 前提：主機不開任何公網 inbound port；SSH 只在 Tailscale（100.64.0.0/10）介面上聽。
# 安裝後務必先 `sshd -t` 再 `systemctl reload ssh`，否則設定錯誤會把自己鎖在外面。

# 只綁 tailscale0 的位址；公網介面完全聽不到 22。
# 真機請以 `tailscale ip -4` 取得實際位址後替換，並確認 systemd 有 After=tailscaled.service
ListenAddress 100.64.0.1
Port 22

# 只認公鑰
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
PermitEmptyPasswords no
PubkeyAuthentication yes
AuthenticationMethods publickey

PermitRootLogin no
MaxAuthTries 3
MaxSessions 10
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2

# 白名單：只有這些群組能 SSH 進主機（guest 不在其中，只能用 JupyterHub 網頁）
AllowGroups labadmin lung-research prostate-research

# 關掉不需要的轉發面；VS Code Remote 只需要 exec/sftp，不需要 X11 或 TCP 轉發
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
GatewayPorts no
PermitTunnel no

# 稽核用：記下公鑰指紋，配合 auditd 可追到「哪把金鑰在何時進來」
LogLevel VERBOSE
PrintLastLog yes

Subsystem sftp internal-sftp

# 短期協作者若真的需要 CLI，另開 Match 區塊限制在唯讀資料夾
Match Group guest
    AllowTcpForwarding no
    ForceCommand internal-sftp -d /data/deid/lung/cohort2018
