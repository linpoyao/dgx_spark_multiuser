# /etc/fail2ban/filter.d/jupyterhub.conf
# JupyterHub 登入失敗會連續吐兩行，只有 tornado 的存取記錄那一行帶來源 IP：
#   [W 2026-09-13 01:20:33.123 JupyterHub base:875] Failed login for alice
#   [W 2026-09-13 01:20:33.124 JupyterHub log:186] 403 POST /hub/login?next=%2Fhub%2F (@100.64.0.9) 120.00ms
# 因此以第二行（403/401 + /hub/login + (@IP)）作為 failregex。
#
# 重要：fail2ban 會先用 datepattern 把「日期字首」從行首剝掉才套 failregex，
# 所以 failregex 不能再寫 `\[[WEC] <日期>`——一寫就永遠 0 matched（實測踩到）。
# 成功登入是 `302 POST /hub/login... (alice@IP)`，不會被誤判。
[Definition]
failregex = ^\s*JupyterHub log:\d+\] (?:403|401) POST /hub/login[^\(]*\(@<HOST>\)
ignoreregex =
datepattern = \[[WEC] {DATE}
